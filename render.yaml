services:
  - type: web
    name: civicfix-genesis
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: CIVICFIX_DB
        value: /var/data/civicfix.db
      - key: PYTHON_VERSION
        value: 3.12.8
    disk:
      name: civicfix-data
      mountPath: /var/data
      sizeGB: 2
