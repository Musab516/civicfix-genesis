services:
  - type: web
    name: civicfix-genesis
    runtime: python
    plan: starter

    buildCommand: |
      pip install -r requirements.txt
      pip install --no-cache-dir "torch==2.14.1+cpu" --index-url https://download.pytorch.org/whl/cpu
      pip install --no-cache-dir "transformers==4.57.6"

    startCommand: uvicorn backend:app --host 0.0.0.0 --port $PORT
